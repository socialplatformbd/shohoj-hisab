on:
  push:
    branches: [main]
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-zip
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip uploaded zip files
        id: unzip
        shell: bash
        run: |
          shopt -s nullglob
          zips=(./*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "রুটে কোনো .zip ফাইল নেই — কিছু করার নেই।"
            exit 0
          fi
          # পুরনো থেকে নতুন ক্রমে (নাম অনুযায়ী) প্রয়োগ
          for f in "${zips[@]}"; do
            echo "আনজিপ হচ্ছে: $f"
            unzip -o -q "$f"
            git rm -f -q -- "$f"
          done
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.unzip.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.unzip.outputs.found == 'true'
        run: npm install --no-audit --no-fund

      - name: Typecheck
        if: steps.unzip.outputs.found == 'true'
        run: npm run typecheck

      - name: Build
        if: steps.unzip.outputs.found == 'true'
        run: npm run build

      - name: Commit and push
        if: steps.unzip.outputs.found == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "কোনো পরিবর্তন নেই।"
            exit 0
          fi
          git commit -m "Apply uploaded zip"
          git push
